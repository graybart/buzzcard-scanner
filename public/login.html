<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in — Admin login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f6f8; color: #1a1d21; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 28px; width: min(340px, 92vw); }
  h1 { font-size: 1.15rem; margin: 0 0 18px; }
  input { font: inherit; width: 100%; padding: 9px 11px; border: 1px solid #e3e6ea; border-radius: 7px; margin-bottom: 12px; }
  button { font: inherit; width: 100%; padding: 9px; border-radius: 7px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
  #err { color: #d62828; font-size: .9rem; margin: -4px 0 12px; display: none; }
  p { color: #6b7380; font-size: .85rem; margin: 16px 0 0; text-align: center; }
  a { color: #2563eb; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Check-in Admin</h1>
    <input type="hidden" name="next" id="next">
    <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password">
    <div id="err">Wrong password.</div>
    <button>Log in</button>
    <p>Just want the count? <a href="/count">View the live total</a></p>
  </form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/admin';
  if (q.has('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
