<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in — Fastpass import</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --fg: #1a1d21; --muted: #6b7380; --line: #e3e6ea;
    --green: #17a34a; --yellow: #b7791f; --red: #d62828; --blue: #1d4ed8; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 40px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  main > * { min-width: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 14px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  textarea {
    width: 100%; min-height: 360px; resize: vertical; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; tab-size: 4;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .opts { display: grid; gap: 8px; margin: 14px 0; }
  .opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .opts input { margin-top: 3px; }
  .opts .warn { color: var(--red); }
  button, .btn {
    font: inherit; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill { font-size: .78rem; padding: 2px 9px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
  .new { background: #dbeafe; color: var(--blue); }
  .have { background: #f1f5f9; color: #475569; }
  .upd { background: #e0e7ff; color: #3730a3; }
  .bl { background: #fee2e2; color: var(--red); }
  .dup { background: #fef3c7; color: var(--yellow); }
  .bad { background: #fde8e8; color: #9b1c1c; }
  .gone { background: #fee2e2; color: var(--red); }
  .tableWrap { max-height: 440px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  td.ln { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.id { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.raw { color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; word-break: break-all; }
  #result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; }
  #result.ok { display: block; background: #dcfce7; color: #14532d; }
  #result.err { display: block; background: #fee2e2; color: #7f1d1d; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>Fastpass bulk import</h1>
  <span class="muted" id="current"></span>
  <a class="btn" href="/admin">← Back to admin</a>
</header>

<main>
  <section class="card">
    <h2>1. Paste IDs</h2>
    <textarea id="paste" spellcheck="false" placeholder="Paste a column from your spreadsheet, one GTID per line.

903123456
903234567
903345678

You can also copy several columns (for example GTID and Name).
The 9-digit ID is found on each line automatically."></textarea>
    <div class="opts">
      <label><input type="checkbox" id="useNotes" checked>
        <span>Use the other columns on each line (for example a name) as the note</span></label>
      <label><input type="radio" name="mode" value="add" checked>
        <span><b>Add</b> to the current fastpass list</span></label>
      <label><input type="radio" name="mode" value="replace">
        <span><b>Replace</b> the whole fastpass list with this paste <span class="warn">(IDs not in the paste are removed)</span></span></label>
    </div>
    <div class="actions">
      <button class="primary" id="import" disabled>Import</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>2. Check the preview</h2>
    <div class="summary" id="summary"><span class="muted">Paste something to see a preview.</span></div>
    <div class="tableWrap">
      <table>
        <thead><tr><th>Line</th><th>ID</th><th>Note</th><th>Result</th></tr></thead>
        <tbody id="preview"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let fastpass = new Map(), blacklist = new Set(), parsed = [];

const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.href = '/login?next=/fastpass'; throw new Error('login required'); }
  return r;
};

async function loadLists() {
  const d = await (await api('/api/lists')).json();
  fastpass = new Map(d.fastpass.map(f => [f.id, f]));
  blacklist = new Set(d.blacklist.map(b => b.id));
  $('current').textContent = `${fastpass.size} ID${fastpass.size === 1 ? '' : 's'} on the fastpass list now`;
  analyze();
}

// Find the 9-digit ID on each line; anything else on the line can become the note.
function parse(text, useNotes) {
  const out = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const m = line.match(/(?<!\d)\d{9}(?!\d)/);
    if (!m) { out.push({ ln: i + 1, raw: line, kind: 'bad' }); return; }
    let note = '';
    if (useNotes) {
      const rest = line.slice(0, m.index) + '\t' + line.slice(m.index + 9);
      note = rest.split('\t').map(c => c.trim()).filter(c => c && !/^[.,;:|-]+$/.test(c)).join(' · ').slice(0, 200);
    }
    out.push({ ln: i + 1, raw: line, id: m[0], note });
  });
  return out;
}

const KIND = {
  new: ['new', 'New'], have: ['have', 'Already on list'], upd: ['upd', 'Note updated'],
  bl: ['bl', 'On blacklist (skipped)'], dup: ['dup', 'Repeated in paste'], bad: ['bad', 'No 9-digit ID (skipped)'],
};

function analyze() {
  const replace = document.querySelector('[name=mode]:checked').value === 'replace';
  parsed = parse($('paste').value, $('useNotes').checked);
  const seen = new Set();
  for (const p of parsed) {
    if (p.kind === 'bad') continue;
    if (seen.has(p.id)) p.kind = 'dup';
    else if (blacklist.has(p.id)) p.kind = 'bl';
    else if (!fastpass.has(p.id)) p.kind = 'new';
    else p.kind = (p.note && p.note !== fastpass.get(p.id).note) ? 'upd' : 'have';
    seen.add(p.id);
  }
  const counts = {};
  for (const p of parsed) counts[p.kind] = (counts[p.kind] || 0) + 1;
  const removed = replace ? [...fastpass.keys()].filter(id => !seen.has(id) || blacklist.has(id)).length : 0;

  const pills = Object.keys(KIND).filter(k => counts[k]).map(k => `<span class="pill ${KIND[k][0]}">${counts[k]} ${KIND[k][1].toLowerCase().replace(/\bid\b/, "ID")}</span>`);
  if (removed) pills.push(`<span class="pill gone">${removed} will be removed</span>`);
  $('summary').innerHTML = parsed.length ? pills.join('') : '<span class="muted">Paste something to see a preview.</span>';

  $('preview').innerHTML = parsed.map(p => `<tr>
    <td class="ln">${p.ln}</td>
    ${p.kind === 'bad' ? `<td class="raw" colspan="2">${esc(p.raw)}</td>` : `<td class="id">${p.id}</td><td>${esc(p.note)}</td>`}
    <td><span class="pill ${KIND[p.kind][0]}">${KIND[p.kind][1]}</span></td></tr>`).join('');

  const toSend = parsed.filter(p => p.kind !== 'bad' && p.kind !== 'dup' && p.kind !== 'bl');
  const changes = (counts.new || 0) + (counts.upd || 0) + removed;
  $('import').disabled = replace ? (toSend.length === 0 && removed === 0) : changes === 0;
  $('import').textContent = replace
    ? `Replace list (${toSend.length} ID${toSend.length === 1 ? '' : 's'})`
    : `Import ${counts.new || 0} new ID${counts.new === 1 ? '' : 's'}` + (counts.upd ? ` + ${counts.upd} note update${counts.upd === 1 ? '' : 's'}` : '');
  return { toSend, removed, replace };
}

$('import').addEventListener('click', async () => {
  const { toSend, removed, replace } = analyze();
  if (replace && removed && !confirm(`Replace the fastpass list? ${removed} ID${removed === 1 ? '' : 's'} currently on it will be removed.`)) return;
  $('import').disabled = true;
  try {
    const r = await api('/api/lists/fastpass/bulk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ replace, items: toSend.map(p => ({ id: p.id, note: p.note })) }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Import failed');
    const parts = [`${d.added} added`];
    if (d.updated) parts.push(`${d.updated} notes updated`);
    if (d.unchanged) parts.push(`${d.unchanged} already on the list`);
    if (d.removed) parts.push(`${d.removed} removed`);
    if (d.skippedBlacklisted.length) parts.push(`${d.skippedBlacklisted.length} skipped (blacklisted)`);
    $('result').className = 'ok';
    $('result').textContent = `Done: ${parts.join(', ')}. The fastpass list now has ${d.total} ID${d.total === 1 ? '' : 's'}.`;
    $('paste').value = '';
    await loadLists();
  } catch (e) {
    $('result').className = 'err';
    $('result').textContent = e.message;
    analyze();
  }
});

$('clear').addEventListener('click', () => { $('paste').value = ''; $('result').className = ''; analyze(); $('paste').focus(); });
$('paste').addEventListener('input', () => { $('result').className = ''; analyze(); });
$('useNotes').addEventListener('change', analyze);
for (const r of document.querySelectorAll('[name=mode]')) r.addEventListener('change', analyze);

// Keep the preview accurate if someone edits the lists from the admin page meanwhile
const es = new EventSource('/api/events');
es.addEventListener('update', ev => { const t = JSON.parse(ev.data).type; if (t === 'fastpass' || t === 'blacklist') loadLists(); });
loadLists();
</script>
</body>
</html>
